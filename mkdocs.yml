site_name: pyvocabulary
site_description: The shared core of composable, JSON-definable building blocks - named registries, JSON Schemas from signatures and JSON-path errors.
site_url: https://aaltatan.github.io/pyvocabulary/
repo_url: https://github.com/aaltatan/pyvocabulary
repo_name: aaltatan/pyvocabulary
edit_uri: edit/main/docs/
copyright: GPL-3.0-only

theme:
  name: material
  icon:
    logo: material/book-alphabet
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - toc.follow

nav:
  - Home: index.md
  - Installation: install.md
  - User guide:
      - guide/index.md
      - Vocabularies: guide/vocabulary.md
      - Names: guide/names.md
      - Argument errors: guide/arguments.md
      - JSON Schema: guide/json-schema.md
      - Labels and choices: guide/labels.md
      - JSON-path errors: guide/paths.md
  - Recipes: recipes.md
  - Reference:
      - reference/index.md
      - API: reference/api.md
      - Type mapping: reference/type-mapping.md
      - Exceptions: reference/exceptions.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aaltatan/pyvocabulary
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/pyvocabulary/
